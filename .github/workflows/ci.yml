name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restaurar dependencias
        run: dotnet restore MiniLIS.Suite.slnx

      - name: Compilar
        run: dotnet build MiniLIS.Suite.slnx --no-restore --configuration Release

      - name: Ejecutar pruebas
        run: dotnet test MiniLIS.Tests/MiniLIS.Tests.csproj --no-build --configuration Release --verbosity normal
